<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 프렌치 냉장고 파먹기</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght=0,700;1,700&family=Outfit:wght=400;500;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFDF5;
            --fridge-color: #F8F9FA;
            --fridge-border: #E9ECEF;
            --accent-color: #6B8E23; /* Olive Green */
            --accent-hover: #556B2F;
            --text-main: #2D3436;
            --text-muted: #636E72;
            --shadow: 0 10px 30px rgba(0,0,0,0.05);
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Gowun Dodum', 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .recipe-image-container {
            width: 100%;
            height: 200px;
            border-radius: 25px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #F8F9FA;
            border: 1px solid #E9ECEF;
        }

        .recipe-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .recipe-image-container:hover img {
            transform: scale(1.05);
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Layout Grid */
        .main-layout {
            display: flex;
            gap: 60px;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Fridge UI */
        .fridge-container {
            width: 450px;
            background: var(--fridge-color);
            border-radius: 50px 50px 20px 20px;
            border: 8px solid var(--fridge-border);
            box-shadow: var(--shadow), inset 0 0 20px rgba(0,0,0,0.02);
            position: relative;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Fridge Door Line */
        .fridge-container::after {
            content: '';
            position: absolute;
            left: 0;
            top: 45%;
            width: 100%;
            height: 4px;
            background: var(--fridge-border);
        }

        .fridge-handle {
            position: absolute;
            right: 20px;
            top: 25%;
            width: 12px;
            height: 80px;
            background: #CED4DA;
            border-radius: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .fridge-handle.bottom {
            top: 55%;
        }

        .shelf {
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 20px;
            min-height: 140px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            border-bottom: 2px solid #DEE2E6;
        }

        .shelf-title {
            grid-column: span 3;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ADB5BD;
            margin-bottom: 5px;
            font-weight: 700;
        }

        /* Ingredient Item */
        .ingredient {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: white;
            border-radius: 18px;
            border: 2px solid #F1F3F5;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }

        .ingredient:hover {
            transform: translateY(-5px);
            border-color: #DEE2E6;
        }

        .ingredient.selected {
            border-color: var(--accent-color);
            background-color: #F8FFF0;
            transform: scale(1.08);
            box-shadow: 0 5px 15px rgba(107, 142, 35, 0.2);
        }

        .ingredient-icon {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .ingredient-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Recipe Result Column */
        .result-container {
            width: 450px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Search Box */
        .search-box {
            width: 100%;
            position: relative;
            margin-bottom: 5px;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 25px;
            border-radius: 30px;
            border: 2.5px solid var(--fridge-border);
            font-family: 'Gowun Dodum', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(107, 142, 35, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
        }

        .recommend-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(107, 142, 35, 0.3);
            display: flex;
